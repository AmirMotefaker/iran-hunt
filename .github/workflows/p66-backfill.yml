name: P66 Product Completion Backfill

on:
  push:
    branches:
      - feat/p66-final-product-readiness
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: p66-product-completion-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout P66 branch
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/p66-final-product-readiness

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scrape current Tehran day
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: bun run scrape -- --no-ai

      - name: Update persistent corpus
        run: bun run corpus:update

      - name: Backfill up to 50 incomplete products
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENRICH_BACKLOG_LIMIT: '50'
          ENRICH_DELAY_MS: '2500'
        run: bun run enrich:backlog

      - name: Report readiness after batch
        continue-on-error: true
        run: bun run audit:readiness

      - name: Commit refreshed product data
        shell: bash
        run: |
          git config user.name "IdehJo P66 Bot"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "data: P66 product completion backfill"
          git push origin HEAD:feat/p66-final-product-readiness
