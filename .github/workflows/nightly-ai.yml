name: Nightly AI (Auto 2am)

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Scrape fresh top products
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: bun run scrape -- --no-ai
      - name: Update persistent corpus
        run: bun run corpus:update
      - name: Process bounded enrichment backlog
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENRICH_BACKLOG_LIMIT: '10'
        run: bun run enrich:backlog
      - name: Audit corpus after enrichment
        run: bun run corpus:audit
      - name: Commit corpus and enrichment health
        shell: bash
        run: |
          git config user.name "IdehJo Bot"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "data: nightly enrichment $(date +%F)"
          git push
