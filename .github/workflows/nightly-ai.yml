name: Nightly AI (Auto 2am)

on:
  schedule:
    - cron: '30 22 * * *'  # 2:00 بامداد تهران
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 1) Scrape fresh top products (no AI)
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: bun run scrape -- --no-ai

      - name: 2) Enrich: comments + AI (today first, then backlog)
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run src/scripts/enrich-today.ts

      - name: Audit corpus after enrichment
        run: bun run corpus:audit

      - name: Commit data
        run: |
          git config user.name "ربات ایده‌جو"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "data: nightly scrape+enrich $(date +%F)"
          git push

