name: Daily Scrape

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bun run scrape
      
      - name: Commit and push data
        run: |
          git config user.name "IranHunt Bot"
          git config user.email "bot@iranhunt.app"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scrape: daily update $(date -u +'%Y-%m-%d') [skip ci]"
            git push
          fi
