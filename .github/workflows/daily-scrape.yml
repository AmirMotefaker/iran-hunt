name: Daily Scrape

on:
  schedule:
    - cron: '30 8 * * *'  # 12:00 تهران
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scrape with AI (US IP)
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run scrape

      - name: Commit data
        run: |
          git config user.name "ربات ایده‌جو"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "scrape: daily update $(date +%F) with AI [skip ci]"
          git push
