name: Daily Scrape (Auto 12am)

on:
  schedule:
    - cron: '30 20 * * *'  # 12:00 شب تهران — اسکرپ محصولات
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scrape products with bounded recovery
        id: scrape
        continue-on-error: true
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: bun run src/scripts/scrape-with-recovery.ts --no-ai

      - name: Update persistent corpus
        run: bun run corpus:update

      - name: Audit corpus health
        run: bun run corpus:audit

      - name: Commit scrape result
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config user.name "ربات ایده‌جو"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "scrape: daily run $(date +%F)"
          git push

      - name: Preserve scrape failure
        if: steps.scrape.outcome == 'failure'
        run: exit 1

