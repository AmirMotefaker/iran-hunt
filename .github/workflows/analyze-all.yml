name: Analyze All

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Analyze ALL products (US IP, batched)
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run src/scripts/analyze-all.ts

      - name: Commit data
        run: |
          git config user.name "ربات ایده‌جو"
          git config user.email "bot@idehjo.ir"
          git add data
          git diff --cached --quiet || git commit -m "data: analyze all products (batch) [skip ci]"
          git push
